name: Restore Hospital Assets

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download hospital assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/images/hospital
          base="https://aadhya-medical.preview.emergentagent.com/images/hospital"
          for f in h-01.webp h-02.webp h-03.webp h-04.webp h-05.webp h-06.webp h-07.webp h-08.webp h-09.webp h-10.webp h-11.webp h-12.webp h-13.webp h-14.webp h-15.webp h-16.webp h-17.webp h-18.webp h-19.webp h-logo.webp logo.webp; do
            echo "Downloading $f"
            curl -fL --retry 3 --connect-timeout 15 "$base/$f" -o "public/images/hospital/$f"
          done

      - name: Commit assets to repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/hospital
          if git diff --cached --quiet; then
            echo "No asset changes to commit."
            exit 0
          fi
          git commit -m "Add Sri Aadhya hospital image assets"
          git push