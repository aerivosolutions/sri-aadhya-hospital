name: Restore Hospital Assets

# The old Emergent preview host is no longer a reliable asset source.
# The website no longer depends on this workflow, so keep this workflow disabled
# rather than allowing every push to fail.
on:
  workflow_dispatch:

jobs:
  disabled:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "Asset restore disabled: source preview host is unavailable."
